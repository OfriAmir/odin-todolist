<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="logo"></div>
        <div>
            <div><button ref="myProjectBtn" class="my-projects-btn">My Projects:</button></div>
            <nav class="projects-wrapper">
                <ol ref="ol" class="projects-ol">
                </ol>
                <button class="add-project-btn">+</button>
            </nav>
        </div>
    </header>
    <main>
        <button class="options-btn"></button>
        <h1>Project 1</h1>
        <ul>
           <li><h2>Description:</h2></li>
           <li><h2>Priority:</h2></li>
           <li><h2>Due Date:</h2></li>
        </ul>
        <button class="add-btn">Add Todo</button>
    </main>
    <aside>
        <h2>Checklist</h2>
        <ul>
        </ul>
    </aside>
    <dialog class="add-writing-entity-dialog">
        <form action="#" method="get" class="add-writing-entity-form">
            <h3>Add Project</h3>
            <label for="title">*Title:</label>
            <input type="text" name="title" id="title" required>
            <label for="description">Description:</label>
            <textarea name="description" id="description" cols="30" rows="10"></textarea>
            <fieldset>
                <legend>Priority:</legend>
                <input type="radio" name="priority" id="unspecified" value="0" checked>
                <label for="unspecified">Unspecified</label>
                <input type="radio" name="priority" id="very-low" value="1">
                <label for="very-low">Very Low</label>
                <input type="radio" name="priority" id="low" value="2">
                <label for="low">Low</label>
                <input type="radio" name="priority" id="middle" value="3">
                <label for="middle">Middle</label>
                <input type="radio" name="priority" id="high" value="4">
                <label for="high">High</label>
                <input type="radio" name="priority" id="very-high" value="5">
                <label for="very-high">Very High</label>
            </fieldset>
            <label for="due-date">Due Date:</label>
            <input type="datetime-local" name="due-date" id="due-date">
            <label for="notes">Notes:</label>
            <textarea name="notes" id="notes" cols="30" rows="10"></textarea>
            <div class="btns-wrapper">
                <button type="button">Cancel</button>
                <button type="submit">Submit</button>
            </div>
        </form>
    </dialog>
    <dialog class="options-dialog" closedby="any">
        <button>Complete</button>
        <button class="pinBtn">Pin</button>
        <button class="pinByPriorityBtn">Pin by priority</button>
        <button>Edit</button>
        <button>More information</button>
        <button>Remove</button>
    </dialog>
</body>
</html>
